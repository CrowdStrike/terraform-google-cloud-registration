name: CI
on:
  push:
    branches:
      - main
  pull_request:

permissions: read-all

jobs:
  format-check:
    runs-on: ubuntu-latest
    name: Check Terraform formatting
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout source code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Terraform format check
        uses: dflook/terraform-fmt-check@ff37545fa0e818467e88bc8456cc8a7b202b1b60
        with:
          path: .

  validate:
    runs-on: ubuntu-latest
    name: Validate
    permissions:
      contents: read
    timeout-minutes: 20

    strategy:
      matrix:
        path:
          - "examples/generic-registration"
          - "examples/infrastructure-manager"
          - "examples/native-terraform"
          - "examples/workspace"
          - "examples/workspace-infrastructure-manager"
          - "modules/agentless-scanning"
          - "modules/asset-inventory"
          - "modules/log-ingestion"
          - "modules/workload-identity"
          - "modules/workspace"
          - "workspace"

    steps:
      - name: Checkout source code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Validate ${{ matrix.path }}
        uses: dflook/terraform-validate@ff93d08a956c97fbc5f5e8c5778705baf7ae3108
        with:
          path: ${{ matrix.path }}

  variable-validation:
    runs-on: ubuntu-latest
    name: Variable validation (TF ${{ matrix.terraform }})
    permissions:
      contents: read
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - terraform: "1.5.7" # Infrastructure Manager default and latest free version
            sha256: c0ed7bc32ee52ae255af9982c8c88a7a4c610485cf1d55feeb037eab75fa082c
            path: examples/infrastructure-manager
          - terraform: "1.14.9"
            sha256: 2e5cffc20a0b48a67a76268723bd5a10b8666f69b2aa4f04906e206726bedd63
            path: examples/infrastructure-manager

    steps:
      - name: Checkout source code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # Installed from the HashiCorp release instead of a setup action, which the
      # enterprise action allowlist does not include. The checksum pins the binary.
      - name: Install Terraform ${{ matrix.terraform }}
        env:
          TF_VERSION: ${{ matrix.terraform }}
          TF_SHA256: ${{ matrix.sha256 }}
        run: |
          zip="terraform_${TF_VERSION}_linux_amd64.zip"
          curl -fsSLo "$RUNNER_TEMP/$zip" "https://releases.hashicorp.com/terraform/${TF_VERSION}/${zip}"
          echo "${TF_SHA256}  $RUNNER_TEMP/$zip" | sha256sum -c -
          unzip -q -d "$RUNNER_TEMP/terraform" "$RUNNER_TEMP/$zip"
          echo "$RUNNER_TEMP/terraform" >> "$GITHUB_PATH"

      - name: Check variable validation with null inputs
        run: |
          terraform version
          .github/scripts/check-variable-validation.sh ${{ matrix.path }}

  docs:
    runs-on: ubuntu-latest
    name: Check terraform documentation
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout source code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          working-dir: .
          config-file: .terraform-docs.yml
          fail-on-diff: true
          recursive: true
      # The action reads config-file from the repo root first, so give the path from the root
      - uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          working-dir: workspace
          config-file: workspace/.terraform-docs.yml
          fail-on-diff: true

  tflint:
    runs-on: ubuntu-latest
    name: TFLint
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout source code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Cache plugin dir
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('.tflint.hcl') }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@4cb9feea73331a35b422df102992a03a44a3bb33 # v6.2.1

      - name: Init TFLint
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint
        run: tflint --recursive --config "$(pwd)/.tflint.hcl" -f compact
